<!DOCTYPE html>
<html>
<head>
    <title>My Multimedia Webpage</title>
</head>

<body style="background-color: orange; text-align: center;">

    <!-- WEB SOFTWARE: HTML creates the webpage -->

    <h1>MY FAVORITE THINGS</h1>

    <p>Welcome to my multimedia webpage!</p>

    <!-- GRAPHICS: Display an image -->

    <h2>My Favorite Picture</h2>

    <img src="picture.jpeg"
         alt="My Favorite Picture"
         width="500"
         height="600">
    
    <!-- MULTIMEDIA: Add a video -->

    <h2>My Favorite Video</h2>

    <iframe width="500" height="600"
        src="video.mp4">
    </iframe>

    <!-- MULTIMEDIA: Add audio -->

    <h2>My Favorite Music</h2>

    <audio controls>
        <source src="20260821-035315.mp3" type="audio/mpeg">
    </audio>

    <h2>About Me</h2>

    <p>My name is Blanco/Berroya.</p>
    <p>My favorite food is French Fries.</p>
    <p>My favorite color is Purple.</p>

</body>
</html>
