<!DOCTYPE html>
<html>
<head>
    <title>My Multimedia Webpage</title>
</head>

<body style="background-color: lightblue; text-align: center;">

    <!--WEB SOFTWARE: HTML creates the webpage -->
    
    <h1>MY FAVORITE THINGS</h1>

    <p>Welcome to my multimedia webpage!</p>

    <!-- GRAPHICS: Display an image -->

    <h2>My Favorite Picture</h2>

    <img src="picture.jpg"
        alt="My favorite picture"
        width="755">

    <!-- MULTIMEDIA: Add a video -->

    <h2>My Favorite Video</h2>

    <iframe width="400" height="250"
        src="video.mp4">
    </iframe>

    <!-- MULTIMEDIA: Add audio -->

    <h2>MY Favorite Music</h2>

    <audio controls>
        <source src="AHOF.mp3" type="audio/mpeg">
    </audio>

    <h2>About Me</h2>

    <p>My name is Rafael Joseph M. Carandang.</p>
    <p>My Favorite food is Sisig.</p>
    <p>My Favorite color is Red.</p>

</body>
</html>
